name: centre-formation
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Initialisez .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Initialisez .env}
      POSTGRES_DB: ${POSTGRES_DB:?Initialisez .env}
      TZ: Africa/Tunis
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  postgres_data:

name: centre-formation-test
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: centre_test
      POSTGRES_PASSWORD: centre_test_local
      POSTGRES_DB: centre_formation_test
      TZ: Africa/Tunis
    ports:
      - "127.0.0.1:5435:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centre_test -d centre_formation_test"]
      interval: 3s
      timeout: 5s
      retries: 20
